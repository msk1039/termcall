# Linux production profile. Signaling remains on host loopback for a TLS
# reverse proxy; TURN binds its configured UDP/TCP and relay ports directly.
services:
  termcall-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: termcall-server:local
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${TERMCALL_ENV_FILE:-.env}
    environment:
      GOMEMLIMIT: 460MiB
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
