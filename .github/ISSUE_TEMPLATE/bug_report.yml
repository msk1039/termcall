name: Bug report
description: Report a reproducible TermCall problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, TURN secrets, or call content. Security
        reports belong in private vulnerability reporting, not this form.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-rc.1 or abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 arm64, iTerm2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Exact commands and non-sensitive configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
