# Temporary HTTP-only virtual host used for the initial ACME HTTP-01 challenge.
# Replace this file with nginx-termcall.conf after the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name termcall-server.m4yank.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
